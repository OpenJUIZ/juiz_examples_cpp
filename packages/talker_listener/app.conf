name: talker_listener
option:
  http_broker:
    start: true
    port: 8000
plugins:
  process_factories:
    talker_cpp:
      language: "c++"
      path: "plugins/{target}"
    listener_cpp:
      language: "c++"
      path: "plugins/{target}"
processes:
  - type_name: talker_cpp
    name: talker0
  - type_name: listener_cpp
    name: listener0
connections:
  - name: con0
    connection_type: Push
    source:
      name: talker0
      type_name: talker_cpp
    destination:
      name: listener0
      type_name: listener_cpp
    arg_name: arg1
ecs:
  - name: ec0
    type_name: main_loop_ec
    rate: 1.0
    bind:
      - name: talker0
        type_name: talker_cpp
    auto_start: true
