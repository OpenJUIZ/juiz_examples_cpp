name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # README の手順で使う juiz_app と pyjuiz の版。cmake/Juiz.cmake の JUIZ_GIT_TAG と合わせる
  JUIZ_VERSION: "0.2.8"
  # Container の 3D モデル (OpenJUIZ/juiz#385) は juiz の次の版で入るので、公開までは juiz コマンドだけ main のコミットから入れる
  # (libjuiz_sdk と pyjuiz は JUIZ_VERSION のまま)。公開 (OpenJUIZ/juiz#386) の後に消して、JUIZ_VERSION の版に戻す
  JUIZ_GIT_REV: "408a5e4b899dea184c2a590b50e86ed83ab8201e"

jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # archive: libjuiz_sdk を GitHub Releases のアーカイブから取得する (既定)
        # source: juiz のソースから cargo でビルドする (アーカイブが無いときの手順)
        sdk: [archive, source]
    name: examples (${{ matrix.sdk }})
    steps:
      - uses: actions/checkout@v4
      # juiz_app は Python を組み込むので、ビルドに Python の開発用ファイルが要る
      - name: ビルドに必要なものを入れる
        run: sudo apt-get update && sudo apt-get install -y python3-dev cmake g++
      - uses: dtolnay/rust-toolchain@stable
      - name: juiz コマンドのキャッシュ
        id: juiz-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/juiz
          key: juiz-app-${{ env.JUIZ_GIT_REV }}-${{ runner.os }}-${{ runner.arch }}
      - name: juiz コマンドをインストールする
        if: steps.juiz-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/OpenJUIZ/juiz --rev "$JUIZ_GIT_REV" juiz_app --locked
      # データ型のサンプル (typed_pose.conf) の Python の Process が pyjuiz を使う
      - name: pyjuiz をインストールする
        run: python3 -m pip install --user --break-system-packages "pyjuiz==${JUIZ_VERSION}"
      - name: libjuiz_sdk のビルド結果のキャッシュ
        if: matrix.sdk == 'source'
        uses: actions/cache@v4
        with:
          path: build/juiz_sdk
          key: juiz-sdk-${{ env.JUIZ_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Juiz.cmake') }}
      - name: サンプルをビルドする
        run: |
          cmake -S . -B build -DJUIZ_SDK_FROM_SOURCE=${{ matrix.sdk == 'source' && 'ON' || 'OFF' }}
          cmake --build build -j
      # アーカイブを取得できずにソースからのビルドに切り替わっていないことを確かめる
      - name: アーカイブの libjuiz_sdk を使ったか確かめる
        if: matrix.sdk == 'archive'
        run: |
          test -f "build/juiz_sdk_archive/juiz_sdk-${JUIZ_VERSION}-x86_64-unknown-linux-gnu/lib/libjuiz_sdk.so"
          test ! -e build/juiz_sdk
      - name: サンプルを動かして結果を確かめる
        run: python3 tests/test_examples.py
      # テストで作った .juizapp (packages/) を、タグのときに Releases に載せるため残す
      - uses: actions/upload-artifact@v4
        if: matrix.sdk == 'archive'
        with:
          name: juizapp-linux
          path: dist/*.juizapp
          if-no-files-found: error

  # Windows: juiz は pip の juiz-cli で入れ、libjuiz_sdk は GitHub Releases の .zip を使う (0.0.27 から)
  examples-windows:
    runs-on: windows-latest
    name: examples (windows)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: juiz コマンドをインストールする
        run: python -m pip install "juiz-cli==$env:JUIZ_VERSION"
      - uses: dtolnay/rust-toolchain@stable
      - name: juiz-cli を juiz の main のコミットから入れ直す
        run: python -m pip install --force-reinstall --no-deps "juiz-cli @ git+https://github.com/OpenJUIZ/juiz@$env:JUIZ_GIT_REV#subdirectory=bindings/juiz_py"
      - name: サンプルをビルドする
        run: |
          cmake -S . -B build
          cmake --build build --config Release -j
      - name: アーカイブの libjuiz_sdk を使ったか確かめる
        shell: bash
        run: |
          test -f "build/juiz_sdk_archive/juiz_sdk-${JUIZ_VERSION}-x86_64-pc-windows-msvc/bin/juiz_sdk.dll"
          test -f build/plugins/juiz_sdk.dll
          test -f build/plugins/increment_process_cpp.dll
          test ! -e build/juiz_sdk
      - name: サンプルを動かして結果を確かめる
        run: python tests/test_examples.py
        env:
          # テストの表示 (日本語や juiz type show の記号) を Windows の既定のコードページではなく UTF-8 で書く
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        with:
          name: juizapp-windows
          path: dist/*.juizapp
          if-no-files-found: error

  # v* のタグを付けたときは、各 OS で作った .juizapp を Releases に載せる
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [examples, examples-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: juizapp-*
          path: dist
          merge-multiple: true
      - name: Releases に載せる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "サンプルのアプリの .juizapp (juiz ${GITHUB_REF_NAME#v} 用)"
          gh release upload "$GITHUB_REF_NAME" dist/*.juizapp --clobber
