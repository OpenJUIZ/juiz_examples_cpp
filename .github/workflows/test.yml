name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # README の手順で使う juiz_app の版。cmake/Juiz.cmake の JUIZ_GIT_TAG と合わせる
  JUIZ_VERSION: "0.0.16"

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # juiz_app は Python を組み込むので、ビルドに Python の開発用ファイルが要る
      - name: ビルドに必要なものを入れる
        run: sudo apt-get update && sudo apt-get install -y python3-dev cmake g++
      - uses: dtolnay/rust-toolchain@stable
      - name: juiz コマンドのキャッシュ
        id: juiz-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/juiz
          key: juiz-app-${{ env.JUIZ_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: juiz コマンドをインストールする
        if: steps.juiz-cache.outputs.cache-hit != 'true'
        run: cargo install juiz_app --version "$JUIZ_VERSION" --locked
      - name: libjuiz_sdk のビルド結果のキャッシュ
        uses: actions/cache@v4
        with:
          path: build/juiz_sdk
          key: juiz-sdk-${{ env.JUIZ_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Juiz.cmake') }}
      - name: サンプルをビルドする
        run: |
          cmake -S . -B build
          cmake --build build -j
      - name: サンプルを動かして結果を確かめる
        run: python3 tests/test_examples.py
