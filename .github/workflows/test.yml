name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # データ型のサンプルは juiz の次の版 (0.0.23) で入る機能を使うので、公開までは juiz の main のコミットから入れる。
  # cmake/Juiz.cmake の JUIZ_GIT_TAG と合わせる。公開後は JUIZ_VERSION と cargo install juiz_app --version に戻す
  JUIZ_GIT_REV: "43a2210c7affaf62f93dc48ad1fd53d77f326df2"

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # juiz_app は Python を組み込むので、ビルドに Python の開発用ファイルが要る
      - name: ビルドに必要なものを入れる
        run: sudo apt-get update && sudo apt-get install -y python3-dev cmake g++
      - uses: dtolnay/rust-toolchain@stable
      - name: juiz コマンドのキャッシュ
        id: juiz-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/juiz
          key: juiz-app-${{ env.JUIZ_GIT_REV }}-${{ runner.os }}-${{ runner.arch }}
      - name: juiz コマンドをインストールする
        if: steps.juiz-cache.outputs.cache-hit != 'true'
        run: cargo install juiz_app --git https://github.com/OpenJUIZ/juiz --rev "$JUIZ_GIT_REV" --locked
      # データ型のサンプル (typed_pose.conf) の Python の Process が pyjuiz を使う
      - name: pyjuiz をインストールする
        run: python3 -m pip install --user --break-system-packages "pyjuiz @ git+https://github.com/OpenJUIZ/juiz@${JUIZ_GIT_REV}#subdirectory=bindings/pyjuiz"
      - name: libjuiz_sdk のビルド結果のキャッシュ
        uses: actions/cache@v4
        with:
          path: build/juiz_sdk
          key: juiz-sdk-${{ env.JUIZ_GIT_REV }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Juiz.cmake') }}
      - name: サンプルをビルドする
        run: |
          cmake -S . -B build
          cmake --build build -j
      - name: サンプルを動かして結果を確かめる
        run: python3 tests/test_examples.py
